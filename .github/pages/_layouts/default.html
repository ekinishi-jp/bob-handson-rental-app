<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-soft: #f8fafc;
        --ink: #172033;
        --muted: #5f6f86;
        --border: #d9e1ec;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --accent-soft: #e8f6f3;
        --warning-soft: #fff7df;
        --code-bg: #101828;
        --code-ink: #e6edf7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        color: var(--ink);
        background:
          linear-gradient(180deg, #eaf3ff 0, rgba(234, 243, 255, 0) 260px),
          var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
        margin: 0;
      }

      a {
        color: var(--accent-strong);
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.18em;
      }

      a:hover {
        color: #0b4f4a;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid rgba(23, 32, 51, 0.1);
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(14px);
      }

      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        max-width: 1440px;
        margin: 0 auto;
        padding: 14px 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        color: inherit;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        flex: 0 0 auto;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-weight: 800;
      }

      .brand-title {
        display: block;
        font-size: 15px;
        font-weight: 750;
        line-height: 1.2;
      }

      .brand-subtitle {
        display: block;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.2;
        margin-top: 2px;
      }

      .top-nav {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .top-nav a,
      .side-nav a {
        border-radius: 8px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 650;
        text-decoration: none;
      }

      .top-nav a {
        padding: 8px 11px;
      }

      .top-nav a:hover,
      .top-nav a.is-active,
      .side-nav a:hover,
      .side-nav a.is-active {
        background: var(--accent-soft);
        color: var(--accent-strong);
      }

      .page-shell {
        display: grid;
        grid-template-columns: 210px minmax(0, 1fr);
        gap: 22px;
        max-width: 1440px;
        margin: 0 auto;
        padding: 28px 24px 72px;
      }

      .side-panel {
        align-self: start;
        position: sticky;
        top: 84px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
        padding: 14px;
      }

      .side-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0;
        margin: 0 0 10px;
      }

      .side-nav {
        display: grid;
        gap: 4px;
      }

      .side-nav a {
        padding: 9px 10px;
      }

      main {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 18px 48px rgba(23, 32, 51, 0.08);
        padding: 42px 56px 56px;
      }

      main > :first-child {
        margin-top: 0;
      }

      h1,
      h2,
      h3,
      h4 {
        color: #111827;
        line-height: 1.25;
      }

      h1 {
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
        font-size: 34px;
        margin: 0 0 28px;
      }

      h2 {
        border-top: 1px solid var(--border);
        font-size: 25px;
        margin: 42px 0 16px;
        padding-top: 28px;
      }

      h3 {
        font-size: 19px;
        margin: 28px 0 10px;
      }

      h4 {
        font-size: 16px;
        margin: 22px 0 8px;
      }

      p,
      ul,
      ol {
        margin-bottom: 16px;
      }

      li + li {
        margin-top: 4px;
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 18px 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel-soft);
      }

      pre {
        overflow-x: auto;
        margin: 18px 0;
        padding: 18px;
        border-radius: 8px;
        background: var(--code-bg);
        color: var(--code-ink);
      }

      code {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
        font-size: 0.94em;
      }

      :not(pre) > code {
        border: 1px solid #d7dee9;
        border-radius: 6px;
        background: #eef3f8;
        color: #27364a;
        padding: 0.12em 0.38em;
      }

      blockquote {
        margin: 20px 0;
        border-left: 4px solid var(--accent);
        border-radius: 0 8px 8px 0;
        background: var(--accent-soft);
        color: #23433f;
        padding: 14px 18px;
      }

      hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 34px 0;
      }

      table {
        border-collapse: collapse;
        display: block;
        width: 100%;
        overflow-x: auto;
        margin: 18px 0 24px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      th,
      td {
        border: 1px solid var(--border);
        padding: 10px 14px;
        vertical-align: top;
      }

      th {
        background: var(--panel-soft);
        color: #223047;
        font-weight: 750;
      }

      tr:nth-child(even) td {
        background: #fbfcfe;
      }

      .mermaid {
        margin: 28px -20px;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: linear-gradient(180deg, #ffffff, #f9fbfd);
        overflow-x: auto;
        text-align: center;
      }

      .mermaid svg {
        display: block;
        width: 100%;
        min-width: 980px;
        max-width: none;
        height: auto;
        margin: 0 auto;
      }

      .callout {
        border: 1px solid #f1d18a;
        border-radius: 8px;
        background: var(--warning-soft);
        color: #5d4209;
        padding: 12px 14px;
      }

      @media (max-width: 880px) {
        .header-inner {
          align-items: flex-start;
          flex-direction: column;
        }

        .top-nav {
          justify-content: flex-start;
        }

        .page-shell {
          display: block;
          padding: 18px 14px 48px;
        }

        .side-panel {
          position: static;
          margin-bottom: 14px;
        }

        .side-nav {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .side-nav a {
          text-align: center;
        }

        main {
          padding: 28px 18px 40px;
        }

        .mermaid {
          margin-right: 0;
          margin-left: 0;
          padding: 16px;
        }

        .mermaid svg {
          min-width: 760px;
        }

        h1 {
          font-size: 28px;
        }

        h2 {
          font-size: 22px;
        }
      }

      @media (max-width: 560px) {
        .header-inner {
          padding: 12px 14px;
        }

        .brand-mark {
          width: 34px;
          height: 34px;
        }

        .top-nav {
          width: 100%;
        }

        .top-nav a {
          flex: 1 1 auto;
          text-align: center;
        }

        .side-nav {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark">B</span>
          <span>
            <span class="brand-title">Bobハンズオン</span>
            <span class="brand-subtitle">賃貸物件検索アプリ</span>
          </span>
        </a>
        <nav class="top-nav" aria-label="主要ページ">
          <a href="{{ '/' | relative_url }}">手順書</a>
          <a href="{{ '/SETUP_MAC.html' | relative_url }}">Mac</a>
          <a href="{{ '/SETUP_WINDOWS.html' | relative_url }}">Windows</a>
        </nav>
      </div>
    </header>
    <div class="page-shell">
      <aside class="side-panel" aria-label="ドキュメントナビゲーション">
        <p class="side-label">Documents</p>
        <nav class="side-nav">
          <a href="{{ '/' | relative_url }}">ハンズオン</a>
          <a href="{{ '/SETUP_MAC.html' | relative_url }}">Mac セットアップ</a>
          <a href="{{ '/SETUP_WINDOWS.html' | relative_url }}">Windows セットアップ</a>
        </nav>
      </aside>
      <main>
        {{ content }}
      </main>
    </div>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "loose",
        theme: "base",
        themeVariables: {
          primaryColor: "#e8f6f3",
          primaryTextColor: "#172033",
          primaryBorderColor: "#0f766e",
          lineColor: "#5f6f86",
          secondaryColor: "#f8fafc",
          tertiaryColor: "#ffffff",
          fontFamily: "-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        }
      });

      const mermaidBlocks = document.querySelectorAll(
        "pre > code.language-mermaid, .language-mermaid pre > code"
      );

      mermaidBlocks.forEach((code) => {
        const container = document.createElement("div");
        const wrapper = code.closest(".language-mermaid");

        container.className = "mermaid";
        container.textContent = code.textContent;

        if (wrapper) {
          wrapper.replaceWith(container);
        } else {
          code.parentElement.replaceWith(container);
        }
      });

      await mermaid.run({
        querySelector: ".mermaid"
      });

      const current = new URL(window.location.href);
      document.querySelectorAll(".top-nav a, .side-nav a").forEach((link) => {
        const target = new URL(link.href);
        const currentPath = current.pathname.replace(/index\.html$/, "");
        const targetPath = target.pathname.replace(/index\.html$/, "");

        if (currentPath === targetPath) {
          link.classList.add("is-active");
        }
      });
    </script>
  </body>
</html>
